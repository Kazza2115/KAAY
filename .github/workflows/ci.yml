# Vérifications sur chaque pull request et chaque poussée :
# compilation TypeScript, lint, puis parcours mobile complet dans Chromium.
name: Vérifications

on:
  pull_request:
  push:
    branches-ignore: []

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile
