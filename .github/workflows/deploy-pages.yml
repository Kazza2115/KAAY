# Publie le build Vite sur GitHub Pages (gratuit pour les dépôts publics).
#
# Activation (une seule fois, à la main) : Settings → Pages → Source :
# « GitHub Actions ». Le jeton du workflow ne peut pas créer le site Pages
# lui-même ; tant que ce n'est pas fait, ce workflow échoue à l'étape
# configure-pages. Ensuite, chaque poussée déploie automatiquement.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [claude/sweet-keller-md08m4]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Le site est servi sous https://<compte>.github.io/KAAY/
          VITE_BASE: /KAAY/
      # GitHub Pages ne connaît pas les routes de l'application monopage :
      # 404.html recopie index.html pour que /restaurant/... charge l'app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
